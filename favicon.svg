<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Main gradient matching the Rellia branding -->
    <linearGradient id="rellia-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <!-- Subtle neon glow filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Base Background: Rounded Box with Dark Glassmorphism -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="#0b0b0f" stroke="url(#rellia-grad)" stroke-width="8" />
  
  <!-- Stylized geometric R logo -->
  <g filter="url(#neon-glow)">
    <!-- Left vertical stem with a sleek curve -->
    <path d="M 180,150 
             L 180,340 
             C 180,355 190,362 205,362 
             C 215,362 225,352 235,340 
             L 260,310" 
          fill="none" 
          stroke="url(#rellia-grad)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Loop and diagonal leg of the R -->
    <path d="M 180,150 
             H 270 
             C 330,150 360,185 360,230 
             C 360,275 325,310 270,310 
             H 180" 
          fill="none" 
          stroke="url(#rellia-grad)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <path d="M 250,310 
             L 335,362" 
          fill="none" 
          stroke="url(#rellia-grad)" 
          stroke-width="38" 
          stroke-linecap="round" />
  </g>
</svg>
